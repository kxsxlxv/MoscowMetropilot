name: ci

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev python3 python3-numpy
      - name: Configure and build
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel 2
      - name: C++ smoke tests
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Split-bag tests
        run: python3 tools/test_bag_sequence.py
      - name: Tiny SQLite/CDR replay
        run: python3 tools/test_precision_replay.py cpp/build/metropilot_precision_replay

  docker-ros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare writable host directories
        run: mkdir -p data artifacts
      - name: Build image
        run: docker compose build
      - name: Start detector
        run: |
          docker compose up -d detector
          sleep 2
          docker compose ps
          docker compose logs detector
      - name: Synthetic end-to-end smoke
        run: |
          docker compose run --rm debug | tee /tmp/debug.log
          grep -q '"sent": 30' /tmp/debug.log
          grep -q '"responses": 30' /tmp/debug.log
          grep -q '"true": 8' /tmp/debug.log
      - name: ROS DDS integration
        run: docker compose exec -T detector /entrypoint.sh python3 /ws/tools/test_ros_integration.py
      - name: Detector logs
        if: always()
        run: docker compose logs detector
